# Adventurers Guild: SkyrimNet custom action (AG_SkyrimNetActions on AG_GuildDialogueQuest) for the Guild Hall's clerks
# (2.0): the same as AG_OpenGuildCounter, gated by the hall plugin's AGHallClerkFaction instead of the innkeepers'
# AG_GuildLiaisonFaction (the clerks are kept out of it). AdventurersGuild.dll opens the hall's counter for them (every
# hold's work) and refuses anyone who keeps no Guild counter.
# The faction check mirrors SeverActions: get_faction_rank >= 0 (members are 0+, non-members -1). Do NOT add "tags:" --
# a tag names a SkyrimNet eligibility tag group, and an unknown one silently makes the action ineligible. Do NOT add
# "customCategory:" either -- that nests the action under a category that needs its own definition file (SeverActions'
# cat_*.yaml); without one the action is never offered. Plain top-level action = neither field.
name: "AG_HallOpenGuildCounter"
description: "You keep the counter of the Adventurers Guild Hall, the Guild's hall in Skyrim. Open it for {{ player.name }}, a registered adventurer. USE THIS whenever {{ player.name }} says they have guild business or Adventurers Guild business, or asks about work, jobs, missives, bounties, their guild card, their reports, trophies or the Guild's services, and you are willing to help them (e.g. 'Let us see what you have got', 'What can the Guild do for you?'). The counter is how you do all Guild business, so use it rather than just talking about it. Opening it commits {{ player.name }} to nothing (no fee, no choice), so there is no yes to wait for: use it on the SAME turn they bring up guild business, not a later one."

questEditorId: "AG_GuildDialogueQuest"
scriptName: "AG_SkyrimNetActions"
executionFunctionName: "OpenCounter_Execute"

parameterMapping:
  - type: "speaker"
    name: "akSpeaker"
    description: "the Adventurers Guild rep doing the guild business"

eligibilityRules:
  - conditions:
      - decoratorName: "get_faction_rank"
        arguments: ["currentActor", "AGHallClerkFaction"]
        comparisonOperator: ">="
        expectedValue: 0
    logicalOperator: "AND"
    required: true
  - conditions:
      - decoratorName: "get_global_value"
        arguments: ["AG_RegisteredGlobal"]
        comparisonOperator: "=="
        expectedValue: 1
    logicalOperator: "AND"
    required: true


eventString: "{{ actor.name }} opened the Adventurers Guild counter for {{ player.name }}"
isShortLived: true

enabled: true
defaultPriority: 5
