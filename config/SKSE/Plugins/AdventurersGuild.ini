[Ranks]
; The level at which rank S begins: 60 to 120, in tens. One table follows from it, for the level each of your
; promotions needs and for the rank shown on threats, dungeons and other adventurers. D and C stay at 12 and 24;
; B and A are spaced between C and S (80 gives 40 and 60). 60 gives the table every version before 1.4.0 had:
; 12 / 24 / 36 / 48 / 60.
; This is only where a NEW game starts. Each save keeps its own value in the MCM (System > Level for rank S), and a
; game started before 1.4.0 stays at 60 until the player moves it there.
SLevel = 80

[Threat]
; A foe's threat rank starts from its level (the table that [Ranks] gives). Three things then correct it.
;
; 1. Danger score, for creatures that fight with their own body: the square root of (max Health x attack damage).
;    The score has its own rank (lowest score of each rank below), and it moves the level rank ONE rank at most,
;    up or down, towards that rank. A sabre cat at level 6 hits far harder than its level says: E becomes D. A wolf
;    that another mod raises to level 15 is still a wolf: D becomes E. It is worked out from the creature in front
;    of you, so it covers creatures added by other mods. People, and creatures that rely on the weapons they carry
;    (draugr, falmer), are not scored: they keep their level rank. 0 = rank by level alone.
DangerScore = 1
ScoreD = 45
ScoreC = 100
ScoreB = 200
ScoreA = 300
ScoreS = 500
; 2. Judgement calls by race or by name, where neither level nor score says it right: a giant or a Dwarven
;    Centurion is never below C, a skeever never above D, Alduin is S at any level. They are listed in
;    AdventurersGuild/threat.resolved.json and can be edited there. 0 = none of them.
RaceRules = 1
; 3. Rank S is never reached by level alone. A threat is S when it is LISTED (an "atLeast": "S" in
;    threat.resolved.json, or one of SKeywords below) or when it PROVES it: at the S level, and for a creature a
;    danger score of ScoreS or more; for a person, a unique actor placed as the boss of a dungeon. Anything else
;    stops at A, whatever level a mod's lists give it. 0 = level is enough again.
SGate = 1
;SKeywords = ActorTypeDragon

[Appraisal]
; Appraisal I reads the threat rank of people and wildlife. Creatures of legend show "[?]" on their health bar until
; the player has this tier of Appraisal. 0 = Appraisal I reads everything.
FantasyTier = 2
; A threat of this rank or above is beyond measure, whatever it is: "[?]" until the player has this tier of Appraisal.
; HighRankTier = 0 turns this off.
HighRank = A
HighRankTier = 3
; A creature of legend is one whose race or actor record has any of these keywords, or one the game calls neither a
; person (ActorTypeNPC) nor an animal (ActorTypeAnimal): spriggans, hagravens, falmer, werewolves. Uncomment to
; replace the built-in list.
;FantasyKeywords = ActorTypeTroll, ActorTypeUndead, ActorTypeDaedra, ActorTypeDragon, ActorTypeDwarven, ActorTypeGhost, ActorTypeGiant, Vampire

[ThreatKeywords]
; <race or actor keyword editor ID> = "+N", "floor X" and/or "max X". Mods reuse the vanilla keywords, so these
; carry over to modded creatures too. The largest adjustment applies (keyword or danger score, never both added),
; the highest floor and the lowest ceiling. A race rule's "atMost" replaces a ceiling given here.
; Dragons are one rank above their level and never below C. With S at level 80: Dragon (level 10) and Blood (20) C,
; Frost (30) B, Elder (40), Ancient (50) and Serpentine (58) A, Revered (62) and Legendary (75) S.
ActorTypeDragon = +1 floor C
; Wildlife stops at B: a wolf that a mod's lists raise to level 80 is still a wolf.
ActorTypeAnimal = max B

[Names]
; 0 = no rank on names, 1 = every hooked call site (debug), 2 = only the sites listed for your runtime.
Mode = 2
; Call-site RVAs of GetDisplayFullName callers; they differ per executable, hence one list per runtime.
; Prompt* = interact-prompt name (guild rank on adventurers only).
; Meter*  = enemy health-meter name (guild rank on adventurers, threat rank on everything else).
; VR 1.4.15 (measured in-game with Ranks): 0x37129F = interact prompt, 0x8B00ED / 0x8B0133 = health meter.
PromptVR = 0x37129F
MeterVR = 0x8B00ED,0x8B0133
; SE 1.5.97 (measured in flat Skyrim SE 2026-09-27): 0x36197F = interact prompt, 0x882740 / 0x882786 = health meter (same 0x46-apart pair as VR).
PromptSE = 0x36197F
MeterSE = 0x882740,0x882786
PromptAE =
MeterAE =

; ---------------------------------------------------------------------------------------------------------------
; The two sections below mirror the two pages of the mod's MCM (System, Debug). They are the starting values for a
; new game, and what applies if SkyUI (the MCM) is not installed. Once a save has the MCM, the MCM's value wins and
; these are not read again for that save - change the setting in the MCM instead.
; ---------------------------------------------------------------------------------------------------------------

[System]
; MCM > System > Show rank labels. One switch for every rank label: an adventurer's guild rank after their name
; ("Lydia (C)"), the threat rank on an enemy's health bar ("[C]"), and your own rank beside your level.
ShowRankLabels = 1
; MCM > System > Show guild notices. The parchment notice for registration, promotion, a completed missive, and
; entering or clearing a dungeon.
ShowNotices = 1
; MCM > System > Notice duration. Seconds a notice stays on screen (2 to 15).
NoticeSeconds = 5

[Debug]
; MCM > Debug > Detailed log. Adds each kill and each Guild counter action to AdventurersGuild.log.
; The one setting where the ini and the MCM add up rather than the MCM winning: either being on is enough, because
; only this one can cover what is logged before a save is loaded.
DetailedLog = 0
; Not in the MCM, and temporary: how your rank is given room beside your level. auto, shift (slide the progress bar
; right; SkyUI's own menus) or shrink (scale the text to fit; menu skins that draw a fixed box around the level).
LevelRankFit = auto
; Translators: load Interface/Translations/AdventurersGuild_<LANGUAGE>.txt whatever the game's language is,
; e.g. Language = FRENCH. Empty = follow the game (Skyrim.ini sLanguage).
Language =
